<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590" viewBox="0 0 1300 590" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
html,body{margin:0;background:#fff}svg{display:block}
text{font-family:Carlito,Calibri,sans-serif;fill:#26363e}
.lab{font-weight:700;font-size:15px;letter-spacing:1.6px;fill:#3f7f99}
.h{font-weight:700;font-size:22px}
.b{font-size:19px;fill:#34444d}
.s{font-size:16.5px;fill:#4f5f68}
.it{font-style:italic;font-size:16.5px;fill:#4f5f68}
.w{fill:#ffffff}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c8c95"/></marker></defs>
<g class="lab">
<text class="lab" x="20" y="26">1 · WASTE</text>
<text class="lab" x="252" y="26">2 · TREATMENT</text>
<text class="lab" x="512" y="26">3 · WASTEFORM</text>
<text class="lab" x="772" y="26">4 · PACKAGED VOLUME</text>
<text class="lab" x="972" y="26">5 · STORAGE</text>
<text class="lab" x="1152" y="26">6 · DISPOSAL</text>
</g>
<line x1="20" x2="1280" y1="38" y2="38" stroke="#c9d3d8"/>

<!-- waste -->
<rect x="20" y="56" width="200" height="404" rx="8" fill="#eef6f8" stroke="#c9d3d8" stroke-width="1.5"/>
<text class="h" x="120" y="236" text-anchor="middle">1 m³ liquid ILW</text>
<text class="b" x="120" y="266" text-anchor="middle">from fission</text>
<text class="b" x="120" y="290" text-anchor="middle">Mo-99 production</text>

<!-- branch arrows -->
<g stroke="#7c8c95" stroke-width="2.2" fill="none">
 <line x1="220" y1="258" x2="234" y2="258"/>
 <line x1="234" y1="111" x2="234" y2="405"/>
 <line x1="234" y1="111" x2="248" y2="111" marker-end="url(#a)"/>
 <line x1="234" y1="258" x2="248" y2="258" marker-end="url(#a)"/>
 <line x1="234" y1="405" x2="248" y2="405" marker-end="url(#a)"/>
</g>

<!-- treatment -->
<rect x="252" y="56" width="230" height="110" rx="8" fill="#3f7f99"/>
<text class="h w" x="367" y="104" text-anchor="middle" style="fill:#fff">Synroc (HIP)</text>
<text class="s" x="367" y="132" text-anchor="middle" style="fill:#e3f0f5">calcined, then pressed hot</text>
<rect x="252" y="203" width="230" height="110" rx="8" fill="#dceff4" stroke="#b9d9e4" stroke-width="1.5"/>
<text class="h" x="367" y="251" text-anchor="middle">Vitrification</text>
<text class="it" x="367" y="279" text-anchor="middle">comparator only</text>
<rect x="252" y="350" width="230" height="110" rx="8" fill="#ede3e1" stroke="#dacfcc" stroke-width="1.5"/>
<text class="h" x="367" y="398" text-anchor="middle">Cementation</text>
<text class="it" x="367" y="426" text-anchor="middle">incumbent route</text>

<!-- wasteform -->
<g fill="#ffffff" stroke="#c9d3d8" stroke-width="1.5">
<rect x="512" y="56" width="230" height="110" rx="8"/><rect x="512" y="203" width="230" height="110" rx="8"/><rect x="512" y="350" width="230" height="110" rx="8"/></g>
<text class="b" x="627" y="105" text-anchor="middle">Ceramic or glass-ceramic</text>
<text class="b" x="627" y="129" text-anchor="middle">in a HIP canister</text>
<text class="b" x="627" y="252" text-anchor="middle">Borosilicate glass</text>
<text class="b" x="627" y="276" text-anchor="middle">in a canister</text>
<text class="b" x="627" y="399" text-anchor="middle">Cemented, overpacked</text>
<text class="b" x="627" y="423" text-anchor="middle">packages</text>

<!-- volume -->
<rect x="772" y="71" width="170" height="80" rx="8" fill="#3f7f99"/>
<text class="h" x="857" y="119" text-anchor="middle" style="fill:#fff">0.25–1 m³</text>
<rect x="772" y="218" width="170" height="80" rx="8" fill="#f7fbfc" stroke="#c9d3d8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="b" x="857" y="253" text-anchor="middle">No public</text>
<text class="b" x="857" y="276" text-anchor="middle">data</text>
<rect x="772" y="365" width="170" height="80" rx="8" fill="#ede3e1" stroke="#dacfcc" stroke-width="1.5"/>
<text class="h" x="857" y="413" text-anchor="middle">≈ 25 m³</text>

<!-- row arrows -->
<g stroke="#7c8c95" stroke-width="2.2" fill="none">
 <line x1="482" y1="111" x2="508" y2="111" marker-end="url(#a)"/>
 <line x1="482" y1="258" x2="508" y2="258" marker-end="url(#a)"/>
 <line x1="482" y1="405" x2="508" y2="405" marker-end="url(#a)"/>
 <line x1="742" y1="111" x2="768" y2="111" marker-end="url(#a)"/>
 <line x1="742" y1="258" x2="768" y2="258" marker-end="url(#a)"/>
 <line x1="742" y1="405" x2="768" y2="405" marker-end="url(#a)"/>
 <line x1="942" y1="111" x2="968" y2="111" marker-end="url(#a)"/>
 <line x1="942" y1="258" x2="968" y2="258" marker-end="url(#a)"/>
 <line x1="942" y1="405" x2="968" y2="405" marker-end="url(#a)"/>
 <line x1="1122" y1="258" x2="1148" y2="258" marker-end="url(#a)"/>
</g>

<!-- storage -->
<rect x="972" y="56" width="150" height="404" rx="8" fill="#ffffff" stroke="#c9d3d8" stroke-width="1.5"/>
<text class="h" x="1047" y="230" text-anchor="middle">Interim</text>
<text class="h" x="1047" y="256" text-anchor="middle">storage</text>
<text class="s" x="1047" y="290" text-anchor="middle">often for decades,</text>
<text class="s" x="1047" y="311" text-anchor="middle">until a repository</text>
<text class="s" x="1047" y="332" text-anchor="middle">opens</text>

<!-- disposal -->
<rect x="1152" y="56" width="128" height="404" rx="8" fill="#e4e9ec" stroke="#c9d3d8" stroke-width="1.5"/>
<text class="h" x="1216" y="230" text-anchor="middle">Geological</text>
<text class="h" x="1216" y="256" text-anchor="middle">disposal</text>
<text class="s" x="1216" y="290" text-anchor="middle">none yet</text>
<text class="s" x="1216" y="311" text-anchor="middle">operating for</text>
<text class="s" x="1216" y="332" text-anchor="middle">this waste</text>

<!-- note -->
<rect x="20" y="484" width="1260" height="90" rx="8" fill="#eef6f8" stroke="#c9d3d8" stroke-width="1.2"/>
<text class="lab" x="42" y="516">WHY VOLUME MATTERS</text>
<text class="b" x="250" y="516">Storage and disposal costs scale with packaged volume, so column 4 drives Synroc’s saving (Section 3.3).</text>
<text class="b" x="250" y="544">Vitrification is shown as a comparator only: no public volume or cost data exist for this waste, so it was not costed.</text>
</svg>