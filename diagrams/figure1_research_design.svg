<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1082" viewBox="0 0 1200 1082" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
html,body{margin:0;padding:0;background:#fff}
svg{display:block}
text{font-family:Carlito,Calibri,sans-serif;fill:#26363e}
.h{font-weight:700;font-size:23px}
.hs{font-weight:700;font-size:20.5px}
.b{font-size:18px;fill:#34444d}
.s{font-size:16.5px;fill:#4f5f68}
.acc{font-weight:700;font-size:17px;fill:#3f7f99}
.lab{font-weight:700;font-size:15px;letter-spacing:1.6px;fill:#3f7f99}
.it{font-style:italic;font-size:16.5px;fill:#4f5f68}
.wt{fill:#ffffff}
</style>
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c8c95"/></marker>
 <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7f99"/></marker>
</defs>
<rect x="328" y="46" width="864" height="358" rx="10" fill="#f7fbfc" stroke="#c9d3d8" stroke-width="1.5"/>
<g stroke="#7c8c95" stroke-width="2.2" fill="none">
 <line x1="302" y1="226" x2="324" y2="226" marker-end="url(#a)"/>
 <path d="M760,404 V422 H220 V472" marker-end="url(#a)"/>
</g>

<!-- ROW 1 labels -->
<text class="lab" x="20" y="26">1 · CASES</text>
<text class="lab" x="340" y="26">2 · FOUR DISCIPLINARY STRANDS (EACH CASE THROUGH ALL FOUR)</text>
<line x1="20" x2="1180" y1="38" y2="38" stroke="#c9d3d8"/>

<!-- cases -->
<rect x="20" y="54" width="282" height="350" rx="8" fill="#eef6f8" stroke="#c9d3d8" stroke-width="1.5"/>
<text class="h" x="161" y="86" text-anchor="middle">Eight rival jurisdictions</text>
<g text-anchor="middle">
 <text class="acc" x="161" y="120">Fission Mo-99 producers</text>
 <text class="b" x="161" y="142">Netherlands · Belgium · South Africa</text>
 <text class="acc" x="161" y="174">Largest past supplier</text>
 <text class="b" x="161" y="196">Canada</text>
 <text class="acc" x="161" y="228">Readiest regulator</text>
 <text class="b" x="161" y="250">United Kingdom</text>
 <text class="acc" x="161" y="282">Future producer</text>
 <text class="b" x="161" y="304">France</text>
 <text class="acc" x="161" y="336">Shared EU rules · Benchmark</text>
 <text class="b" x="161" y="358">EU framework · Australia</text>
</g>
<text class="it" x="161" y="390" text-anchor="middle">Each an obvious first pick on one lens</text>

<!-- strands -->
<rect x="340" y="58" width="410" height="160" rx="8" fill="#dceff4" stroke="#c9d3d8" stroke-width="1.5"/>
<text class="hs" x="362" y="88">Technical</text>
<text class="b" x="362" y="120" style="font-style:italic;fill:#3f7f99">Does the waste suit Synroc, and how ready is it?</text>
<text class="b" x="362" y="144">Chemistry, durability, volume; readiness (TRL)</text>
<text class="s" x="362" y="198">Materials science · engineering</text>

<rect x="770" y="58" width="410" height="160" rx="8" fill="#d5eee5" stroke="#c9d3d8" stroke-width="1.5"/>
<text class="hs" x="792" y="88">Economic</text>
<text class="b" x="792" y="120" style="font-style:italic;fill:#3f7f99">Is Synroc cheaper than cement over its life?</text>
<text class="b" x="792" y="144">Present-value cost; Monte Carlo, 20,000 scenarios</text>
<text class="s" x="792" y="198">Economics · cost–benefit analysis</text>

<rect x="340" y="232" width="410" height="160" rx="8" fill="#e1e9f5" stroke="#c9d3d8" stroke-width="1.5"/>
<text class="hs" x="362" y="266">Law and politics</text>
<text class="b" x="362" y="298" style="font-style:italic;fill:#3f7f99">Can it be licensed, and will governments back it?</text>
<text class="b" x="362" y="322">Four-question legal test; Kingdon policy window</text>
<text class="s" x="362" y="372">Law · political science</text>

<rect x="770" y="232" width="410" height="160" rx="8" fill="#e6f2e1" stroke="#c9d3d8" stroke-width="1.5"/>
<text class="hs" x="792" y="266">Social licence</text>
<text class="b" x="792" y="298" style="font-style:italic;fill:#3f7f99">Will host communities accept it?</text>
<text class="b" x="792" y="322">Social licence framework; documented site cases</text>
<text class="s" x="792" y="372">Sociology · community studies</text>

<g transform="translate(0,-36)">
<!-- ROW 2 -->
<rect x="20" y="470" width="780" height="528" rx="10" fill="#f7fbfc" stroke="#c9d3d8" stroke-width="1.5"/>
<text class="lab" x="244" y="496">3 · TWO-STAGE DECISION TOOL</text>
<text class="lab" x="830" y="496">4 · OUTPUTS</text>

<!-- stage 1 -->
<rect x="40" y="512" width="360" height="282" rx="8" fill="#bfe3d6" stroke="#a9d4c5" stroke-width="1.5"/>
<text class="h" x="220" y="546" text-anchor="middle">Stage 1 · Screen</text>
<text class="s" x="220" y="571" text-anchor="middle">Non-compensatory: no strength elsewhere</text>
<text class="s" x="220" y="591" text-anchor="middle">can offset a failure</text>
<text class="b" x="62" y="628">✕  Chemistry mismatch</text>
<text class="b" x="62" y="655">✕  Legal block</text>
<text class="b" x="62" y="682">✕  Too little waste to pay</text>
<line x1="62" x2="378" y1="702" y2="702" stroke="#9ccbb9"/>
<text class="s" x="62" y="728">Pass → Stage 2   ·   Fail → held in reserve</text>
<text class="s" x="62" y="752">Cannot be tested yet → evidence-gap register</text>
<text class="s" x="62" y="776">Survivors: Netherlands, Belgium</text>

<line x1="400" y1="652" x2="426" y2="652" stroke="#7c8c95" stroke-width="2.2" marker-end="url(#a)"/>

<!-- stage 2 -->
<rect x="430" y="512" width="350" height="282" rx="8" fill="#bfe3d6" stroke="#a9d4c5" stroke-width="1.5"/>
<text class="h" x="605" y="546" text-anchor="middle">Stage 2 · Rank and test</text>
<text class="s" x="605" y="571" text-anchor="middle">Weighted sum of 1–5 scores</text>
<text class="s" x="605" y="591" text-anchor="middle">on all four strands</text>
<text class="b" x="452" y="628">Random weights (SMAA-2)</text>
<text class="b" x="452" y="655">Score error of ±0.5 and ±1 point</text>
<text class="b" x="452" y="682">Volume stress test</text>
<line x1="452" x2="758" y1="702" y2="702" stroke="#9ccbb9"/>
<text class="s" x="452" y="728">Robust = ranked first in at least 75%</text>
<text class="s" x="452" y="752">of draws, a threshold fixed before</text>
<text class="s" x="452" y="776">the analysis</text>

<!-- register -->
<line x1="220" y1="794" x2="220" y2="818" stroke="#7c8c95" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="40" y="822" width="360" height="158" rx="8" fill="#ffffff" stroke="#7c8c95" stroke-width="1.6" stroke-dasharray="7 5"/>
<text class="hs" x="220" y="852" text-anchor="middle">Evidence-gap register</text>
<text class="b" x="62" y="882">Conditions public data cannot yet test,</text>
<text class="b" x="62" y="905">each logged with the data that would</text>
<text class="b" x="62" y="928">close it, rather than guessed</text>
<text class="s" x="62" y="960">e.g. South Africa’s volume and cost</text>
<path d="M40,900 H30 V600 H38" fill="none" stroke="#7c8c95" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>

<!-- risk -->
<line x1="605" y1="794" x2="605" y2="818" stroke="#7c8c95" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="430" y="822" width="350" height="158" rx="8" fill="#ffffff" stroke="#c9d3d8" stroke-width="1.6"/>
<text class="hs" x="605" y="852" text-anchor="middle">Risk assessment</text>
<text class="b" x="452" y="882">ISO 31000 register of 16 risks</text>
<text class="b" x="452" y="905">across all four strands</text>
<text class="s" x="452" y="937">Risks that would remove both survivors</text>
<text class="s" x="452" y="960">become decision gates G1–G3</text>

<!-- outputs -->
<line x1="780" y1="652" x2="826" y2="652" stroke="#7c8c95" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M780,901 H806 V740 H826" fill="none" stroke="#7c8c95" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="830" y="512" width="350" height="282" rx="8" fill="#3f7f99"/>
<text class="h wt" x="1005" y="546" text-anchor="middle">Recommendations for ANSTO</text>
<text class="b wt" x="854" y="590">A   License, rather than build</text>
<text class="b wt" x="854" y="620">B   Prove Synroc on each licensee’s waste</text>
<text class="b wt" x="854" y="650">C   Earn social licence site by site</text>
<text class="b wt" x="854" y="680">D   Keep the screen live</text>
<line x1="854" x2="1156" y1="710" y2="710" stroke="#7fb0c4"/>
<text class="s" x="854" y="740" style="fill:#e6f2f7">Licences signed only after gates G1–G3:</text>
<text class="s" x="854" y="764" style="fill:#e6f2f7">formulation, package and SyMo licence</text>

<line x1="1005" y1="794" x2="1005" y2="818" stroke="#3f7f99" stroke-width="2.2" marker-end="url(#ad)"/>
<rect x="830" y="822" width="350" height="158" rx="8" fill="#ffffff" stroke="#3f7f99" stroke-width="1.8"/>
<text class="hs" x="1005" y="852" text-anchor="middle">Reusable open tool</text>
<text class="b" x="852" y="882">Website and R code on GitHub. ANSTO</text>
<text class="b" x="852" y="905">adds its confidential data (volumes,</text>
<text class="b" x="852" y="928">costs, compositions) and decides in-house</text>
<text class="s" x="852" y="960">Closes the gaps public data cannot</text>

<!-- iteration strip -->
<rect x="20" y="1014" width="1160" height="96" rx="8" fill="#eef6f8" stroke="#c9d3d8" stroke-width="1.2"/>
<text class="lab" x="42" y="1046">ITERATION</text>
<text class="b" x="152" y="1046">Evidence redirected the design three times: Canada dropped as the lead case; political analysis</text>
<text class="b" x="152" y="1070">added when law did not separate the candidates; licensee changed from producers to national</text>
<text class="b" x="152" y="1094">waste agencies. Presentation feedback sharpened the case for screening rather than assuming a market.</text>
</g>
</svg>